<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱娜娜随便吃</title>
  <style>
    :root {
      --primary: #FF8FAB;
      --primary-dark: #FF6B9D;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --bg: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --card-bg: #fff;
      --text: #333;
      --text-light: #888;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }
    .app { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sync-info {
      font-size: 12px;
      color: var(--text-light);
      text-align: right;
      line-height: 1.4;
    }
    .main-nav {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.7);
      color: var(--text-light);
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: var(--shadow);
    }
    .page { display: none; }
    .page.active { display: block; }
    .search-bar { margin-bottom: 16px; }
    .search-bar input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid transparent;
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.3s;
    }
    .search-bar input:focus {
      border-color: var(--primary);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.6);
      color: var(--text-light);
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 2px 8px rgba(255,111,157,0.3);
    }
    .tab-btn .count {
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.8;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    /* 无图片时的默认图容器 */
    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-img-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.25);
      padding: 10px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.5);
      line-height: 1.4;
    }
    .card-info {
      padding: 12px;
      position: relative;
      padding-right: 40px;
    }
    .card-id {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-channel {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
    }
    .card-status {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-国现可排发 { background: #E8F5E9; color: #2E7D32; }
    .status-现货可排发 { background: #E8F5E9; color: #2E7D32; }
    .status-运回中 { background: #FFF3E0; color: #E65100; }
    .status-岛内到货 { background: #E3F2FD; color: #1565C0; }
    .status-开团中 { background: #F3E5F5; color: #7B1FA2; }
    .status-待退补 { background: #FFF8E1; color: #F57F17; }
    .status-囤货已超时 { background: #FFEBEE; color: #C62828; }
    .status-已退款 { background: #ECEFF1; color: #546E7A; }
    .status-未出荷 { background: #E8EAF6; color: #3F51B5; }
    .status-已散 { background: #FBE9E7; color: #BF360C; }
    .new-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: #FF4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 8px;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(255,68,68,0.3);
    }
    .card-add-btn {
      position: absolute;
      right: 8px; bottom: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 18px; font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255,111,157,0.4);
      z-index: 5;
      line-height: 1;
    }
    .card-add-btn.added {
      background: linear-gradient(135deg, #a0a0a0, #888);
      font-size: 14px;
    }
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; margin-top: 20px; margin-bottom: 40px;
    }
    .page-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.7);
      color: var(--text);
      transition: all 0.3s;
    }
    .page-btn:hover, .page-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
    }
    .page-btn:disabled {
      opacity: 0.4; cursor: not-allowed;
    }
    .page-jump-wrap {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.7);
      padding: 4px 8px;
      border-radius: 10px;
    }
    .page-jump-wrap input {
      width: 48px;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      outline: none;
    }
    .page-jump-wrap span {
      font-size: 12px; color: var(--text-light);
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      padding: 20px;
    }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 20px 20px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-close {
      width: 32px; height: 32px;
      border: none;
      border-radius: 50%;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.3s;
    }
    .modal-close:hover { background: #e0e0e0; }
    .modal-body { padding: 20px; }
    .detail-img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 16px;
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 13px; color: var(--text-light); }
    .detail-value { font-size: 14px; font-weight: 600; text-align: right; max-width: 60%; }
    .detail-value.overdue { color: #C62828; }
    .detail-value.warning { color: #E65100; }
    .detail-value.safe { color: #2E7D32; }
    .modal-actions {
      padding: 0 20px 20px;
      display: flex; gap: 10px;
    }
    .btn-primary {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255,111,157,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,111,157,0.4);
    }
    .btn-primary.added {
      background: linear-gradient(135deg, #a0a0a0, #888);
      box-shadow: none;
    }
    .cn-input-wrap {
      padding: 30px;
      text-align: center;
    }
    .cn-input-wrap h2 {
      font-size: 22px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cn-input-wrap p {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .cn-input-wrap input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }
    .cn-input-wrap input:focus {
      border-color: var(--primary);
    }
    .cn-input-wrap .btn-primary {
      width: 100%;
    }
    .my-header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .my-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .my-cn-block { flex: 1; }
    .my-cn-name { font-size: 20px; font-weight: 700; }
    .my-cn-desc { font-size: 13px; color: var(--text-light); margin-top: 4px; }
    .alert-section { margin-bottom: 24px; }
    .alert-section h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex; align-items: center;
      gap: 6px;
    }
    .alert-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .alert-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.3s;
      cursor: pointer;
    }
    .alert-card:hover { transform: translateY(-2px); }
    .alert-card-num {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .alert-card-label {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 600;
    }
    .alert-card.green .alert-card-num { color: #2E7D32; }
    .alert-card.red .alert-card-num { color: #C62828; }
    .alert-card.orange .alert-card-num { color: #E65100; }
    .list-section { margin-bottom: 24px; }
    .list-section h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .list-section h2 .back-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-dark);
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state-text { font-size: 14px; }
    .card-img-wrap, .card-img, .card-img-placeholder { cursor: zoom-in; }
    .image-viewer {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.85);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      padding: 20px;
    }
    .image-viewer.active { display: flex; }
    .image-viewer-img {
      max-width: 100%; max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    .image-viewer-bar {
      margin-top: 16px;
      display: flex; gap: 12px;
    }
    .image-viewer-bar .btn {
      padding: 10px 20px;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .image-viewer-bar .btn-close {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    .image-viewer-bar .btn-close:hover { background: rgba(255,255,255,0.3); }
    .image-viewer-bar .btn-download {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 4px 15px rgba(255,111,157,0.3);
    }
    .image-viewer-bar .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,111,157,0.4);
    }
    @media (max-width: 640px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .header h1 { font-size: 22px; }
      .alert-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }
    /* 顶部过期提醒横幅 */
    .alert-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #C62828, #E53935);
      color: #fff;
      padding: 14px 40px 14px 20px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      z-index: 9999;
      cursor: pointer;
      animation: bannerSlide 0.4s ease;
      display: none;
    }
    .alert-banner.show { display: block; }
    @keyframes bannerSlide {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }
    .alert-banner-close {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      cursor: pointer;
      background: none; border: none;
      padding: 0; line-height: 1;
    }
    .alert-banner-close:hover { color: #fff; }
    /* 过时数据卡片 */
    .card.stale {
      opacity: 0.65;
      position: relative;
    }
    .card.stale::after {
      content: '⚠️ 已从表移除';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      z-index: 2;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- CN设置弹窗（在我的页面使用） -->
  <div id="cnEditModal" class="modal-overlay" style="display:none;" onclick="if(event.target.id==='cnEditModal')closeCNEdit()">
    <div class="modal">
      <div class="cn-input-wrap">
        <h2>设置昵称</h2>
        <p>输入你的 CN 昵称，留空不显示</p>
        <input type="text" id="cnEditInput" placeholder="例如：大神万理" maxlength="20" onkeypress="if(event.key==='Enter')saveCNEdit()">
        <button class="btn-primary" onclick="saveCNEdit()">确定</button>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div id="detailModal" class="modal-overlay" style="display:none;">
    <div class="modal" id="detailModalContent"></div>
  </div>

  <!-- 图片查看器 -->
  <div id="imageViewer" class="image-viewer" onclick="if(event.target===this)closeImageViewer()">
    <img id="viewerImg" class="image-viewer-img" src="" alt="">
    <div class="image-viewer-bar">
      <button class="btn btn-close" onclick="closeImageViewer()">关闭</button>
      <a id="viewerDownload" class="btn btn-download" href="" download="" target="_blank">保存图片</a>
    </div>
  </div>

  <!-- 顶部过期提醒横幅 -->
  <div id="alertBanner" class="alert-banner" onclick="goToOverdueTab()">
    <span id="alertBannerText"></span>
    <button class="alert-banner-close" onclick="event.stopPropagation();dismissAlertBanner()">&#10005;</button>
  </div>

  <!-- 主应用 -->
  <div class="app" id="app" style="display:none;">
    <header class="header">
      <h1>爱娜娜随便吃</h1>
      <div class="sync-info" id="syncInfo"></div>
    </header>

    <nav class="main-nav">
      <button class="nav-btn active" data-page="home" onclick="switchPage('home')">首页</button>
      <button class="nav-btn" data-page="my" onclick="switchPage('my')">我的</button>
    </nav>

    <!-- 首页 -->
    <div class="page active" id="homePage">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索商品ID..." oninput="onSearch()">
      </div>
      <div class="tabs" id="tabContainer"></div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 我的页面 -->
    <div class="page" id="myPage">
      <div class="my-header" id="myHeader" onclick="openCNEdit()">
        <div class="my-avatar" id="myAvatar"></div>
        <div class="my-cn-block">
          <div class="my-cn-name" id="myCnName"></div>
          <div class="my-cn-desc" id="myCnDesc">已添加 <span id="listCount">0</span> 件商品到List</div>
        </div>
      </div>
      <div class="alert-section">
        <h2>囤货时间预警</h2>
        <div class="alert-stats" id="alertStats"></div>
      </div>
      <div class="list-section">
        <h2 id="myListTitle">
          我的List
          <span class="back-btn" id="alertBackBtn" onclick="showAllList()">显示全部</span>
        </h2>
        <div id="myListContainer"></div>
      </div>
    </div>
  </div>

  <script>
    // ============ 数据 ============
    let RAW_DATA = [];
    let ALL_STATUS = [];
    const TAB_CONFIG = [
      { key: '全部', label: '全部', filter: null },
      { key: '国现可排发', label: '国现可排发', filter: item => item.status === '国现可排发' || item.status === '现货可排发' },
      { key: '即将到期', label: '即将到期', filter: (item, today) => {
        const ddl = parseDate(item.storageDDL);
        if (!ddl) return false;
        const diff = Math.ceil((ddl - today) / (1000*60*60*24));
        return diff >= 0 && diff <= 30;
      }},
      { key: '待退补', label: '待退补', filter: item => item.status === '待退补' },
      { key: '已超时', label: '已超时', filter: (item, today) => {
        const ddl = parseDate(item.storageDDL);
        if (!ddl) return false;
        const diff = Math.ceil((ddl - today) / (1000*60*60*24));
        return diff < 0;
      }},
      { key: '运回中', label: '运回中', filter: item => item.status === '运回中' },
      { key: '已退款', label: '已退款', filter: item => item.status === '已退款' }
    ];

    function initData() {
      ALL_STATUS = [...new Set(RAW_DATA.map(d => d.status))].sort();
      // 倒序排列，最新数据在前（原始数据按Excel行序，旧→新，reverse后新→旧）
      RAW_DATA.reverse();
      // 检查状态变化（New角标）
      checkStatusChanges();
      // 记录同步时间
      saveSyncTime();
    }

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        RAW_DATA = data;
        initData();
        init();
      })
      .catch(err => {
        console.error('加载数据失败', err);
        document.body.innerHTML = '<div style="text-align:center;padding:60px;">数据加载失败，请刷新重试</div>';
      });

    // ============ 旧数据路径兼容 ============
    function fixLegacyPath(item) {
      if (!item || !item.image || item.image === '/') return item;
      if (item.image.startsWith('images/image') && !item.image.includes('/full/') && !item.image.includes('/thumb/')) {
        const fname = item.image.split('/').pop();
        const stem = fname.replace(/\.[^.]+$/, '');
        item.image = 'images/full/' + fname;
        item.thumb = 'images/thumb/' + stem + '.jpg';
      }
      else if (!item.thumb && item.image && item.image !== '/') {
        const fname = item.image.split('/').pop();
        const stem = fname.replace(/\.[^.]+$/, '');
        item.thumb = 'images/thumb/' + stem + '.jpg';
      }
      return item;
    }

    // ============ 工具函数 ============
    function hash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h + str.charCodeAt(i)) | 0;
      }
      return Math.abs(h);
    }
    const GRADIENTS = [
      ['#FF9A9E','#FECFEF'],['#A18CD1','#FBC2EB'],['#84FAB0','#8FD3F4'],
      ['#FFECD2','#FCB69F'],['#667EEA','#764BA2'],['#F093FB','#F5576C'],
      ['#4FACFE','#00F2FE'],['#43E97B','#38F9D7'],['#FA709A','#FEE140'],
      ['#30CFD0','#330867'],['#A8EDEA','#FED6E3'],['#D299C2','#FEF9D7']
    ];
    function getGradient(str) {
      const g = GRADIENTS[hash(str) % GRADIENTS.length];
      return `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
    }
    function getShort(str) {
      if (!str || str === '/') return '?';
      const c = str.charAt(0);
      return /[a-zA-Z]/.test(c) ? c.toUpperCase() : c;
    }
    function parseDate(str) {
      if (!str || str === '/' || str === '-') return null;
      const m = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (!m) return null;
      return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }
    function normalize(v) {
      return (!v || v.trim() === '' || v === ' ') ? '/' : v.trim();
    }

    // ============ 状态管理 ============
    let cn = localStorage.getItem('ainana_cn') || '';
    let currentTab = '全部';
    let searchQuery = '';
    let currentPage = 1;
    const PAGE_SIZE = 18;
    let myListFilter = null;
    let NEW_BADGES = new Set();

    function getList() {
      try {
        let list = JSON.parse(localStorage.getItem('ainana_list_' + cn) || '[]');
        return list.map(fixLegacyPath);
      }
      catch { return []; }
    }
    function saveList(list) {
      localStorage.setItem('ainana_list_' + cn, JSON.stringify(list));
    }
    function inList(id) {
      return getList().some(x => x.id === id);
    }

    // List 自动同步：用ID去 RAW_DATA 匹配最新数据
    function syncListItems() {
      const list = getList();
      return list.map(saved => {
        const fresh = RAW_DATA.find(x => x.id === saved.id);
        if (fresh) {
          // 保留 addedAt，用最新数据覆盖
          return { ...fresh, addedAt: saved.addedAt };
        } else {
          // 已从表中移除，保留旧快照但标记 stale
          return { ...saved, _stale: true };
        }
      });
    }

    // ============ 顶部过期提醒横幅 ============
    function checkStorageAlerts() {
      if (sessionStorage.getItem('ainana_alert_dismissed') === '1') return;
      const today = new Date(); today.setHours(0,0,0,0);
      const alerts = RAW_DATA.filter(item => {
        // 已终止状态不需要囤货提醒
        if (['已退款', '已排发', '国现可排发', '现货可排发'].includes(item.status)) return false;
        const ddl = parseDate(item.storageDDL);
        if (!ddl) return false;
        return ddl < today;
      });
      if (alerts.length > 0) {
        const text = alerts.length === 1
          ? `⚠️ 有 1 件谷子囤货已超时，点击查看`
          : `⚠️ 有 ${alerts.length} 件谷子囤货已超时，点击查看`;
        document.getElementById('alertBannerText').textContent = text;
        document.getElementById('alertBanner').classList.add('show');
      }
    }
    function dismissAlertBanner() {
      document.getElementById('alertBanner').classList.remove('show');
      sessionStorage.setItem('ainana_alert_dismissed', '1');
    }
    function goToOverdueTab() {
      dismissAlertBanner();
      currentTab = '已超时';
      currentPage = 1;
      switchPage('home');
      renderTabs();
      renderCards();
    }

    function saveSyncTime() {
      const now = new Date();
      const text = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      localStorage.setItem('ainana_sync_time', text);
    }
    function renderSyncInfo() {
      const t = localStorage.getItem('ainana_sync_time');
      const el = document.getElementById('syncInfo');
      if (el && t) el.textContent = '同步：' + t;
    }

    function checkStatusChanges() {
      let snapshot = {};
      let oldSnapshot = {};
      try {
        oldSnapshot = JSON.parse(localStorage.getItem('ainana_status_snapshot') || '{}');
      } catch(e) {}
      NEW_BADGES = new Set();
      RAW_DATA.forEach(item => {
        const oldStatus = oldSnapshot[item.id];
        if (oldStatus !== undefined &&
            oldStatus !== '国现可排发' && oldStatus !== '现货可排发' &&
            (item.status === '国现可排发' || item.status === '现货可排发')) {
          NEW_BADGES.add(item.id);
        }
        snapshot[item.id] = item.status;
      });
      localStorage.setItem('ainana_status_snapshot', JSON.stringify(snapshot));
    }

    // ============ 初始化 ============
    function init() {
      showApp();
    }
    function showApp() {
      document.getElementById('app').style.display = 'block';
      renderSyncInfo();
      renderTabs();
      renderCards();
      checkStorageAlerts();
    }

    // ============ CN设置 ============
    function openCNEdit() {
      document.getElementById('cnEditInput').value = cn;
      document.getElementById('cnEditModal').style.display = 'flex';
    }
    function saveCNEdit() {
      const val = document.getElementById('cnEditInput').value.trim();
      cn = val;
      localStorage.setItem('ainana_cn', cn);
      document.getElementById('cnEditModal').style.display = 'none';
      if (document.getElementById('myPage').classList.contains('active')) {
        renderMyPage();
      }
    }
    function closeCNEdit() {
      document.getElementById('cnEditModal').style.display = 'none';
    }

    // ============ 导航 ============
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(page + 'Page').classList.add('active');
      document.querySelector(`.nav-btn[data-page="${page}"]`).classList.add('active');
      if (page === 'my') renderMyPage();
    }

    // ============ Tab ============
    function renderTabs() {
      const items = getFilteredItems();
      const today = new Date(); today.setHours(0,0,0,0);
      const counts = {};
      TAB_CONFIG.forEach(tab => {
        if (tab.filter === null) {
          counts[tab.key] = items.length;
        } else {
          counts[tab.key] = items.filter(item => tab.filter(item, today)).length;
        }
      });

      const container = document.getElementById('tabContainer');
      container.innerHTML = TAB_CONFIG.map(tab => {
        const active = tab.key === currentTab ? 'active' : '';
        const cnt = counts[tab.key] || 0;
        return `<button class="tab-btn ${active}" onclick="setTab('${tab.key}')">${tab.label}<span class="count">${cnt}</span></button>`;
      }).join('');
    }
    function setTab(tab) {
      currentTab = tab;
      currentPage = 1;
      renderTabs();
      renderCards();
    }

    // ============ 搜索 & 过滤 ============
    function onSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      currentPage = 1;
      renderTabs();
      renderCards();
    }
    function getFilteredItems() {
      let items = RAW_DATA;
      if (searchQuery) {
        items = items.filter(x => x.id.toLowerCase().includes(searchQuery));
      }
      return items;
    }
    function getDisplayItems() {
      let items = getFilteredItems();
      const tab = TAB_CONFIG.find(t => t.key === currentTab);
      if (tab && tab.filter) {
        const today = new Date(); today.setHours(0,0,0,0);
        items = items.filter(item => tab.filter(item, today));
      }
      return items; // RAW_DATA已在initData中reverse，所以这里是倒序
    }

    // ============ 首页卡片 ============
    const NO_IMG_THUMB = 'images/thumb/no-image.png';
    const NO_IMG_FULL  = 'images/full/no-image.png';

    function buildCardImage(item) {
      if (item.thumb && item.thumb !== '/') {
        const gradient = getGradient(item.id);
        const short = getShort(item.id);
        return `
          <img class="card-img" src="${item.thumb}" alt="${item.id}" loading="lazy"
            onclick="event.stopPropagation();openImageViewer('${item.image || item.thumb}')"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="card-img-placeholder" style="background:${gradient};display:none" onclick="event.stopPropagation();openImageViewer('${item.image || item.thumb}')">${short}</div>`;
      }
      const overlayText = item.imgText || '暂无图片^ ^';
      return `
        <div class="card-img-wrap" onclick="event.stopPropagation();openImageViewer('${NO_IMG_FULL}')">
          <img src="${NO_IMG_THUMB}" alt="暂无图片" loading="lazy">
          <div class="card-img-overlay">${overlayText}</div>
        </div>`;
    }

    function renderCards() {
      const items = getDisplayItems();
      const total = items.length;
      const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = items.slice(start, start + PAGE_SIZE);

      const grid = document.getElementById('cardGrid');
      if (total === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon"></div><div class="empty-state-text">暂无数据</div></div>`;
      } else {
        grid.innerHTML = pageItems.map(item => {
          const imgHtml = buildCardImage(item);
          const isAdded = inList(item.id);
          const newBadge = NEW_BADGES.has(item.id) ? '<span class="new-badge">New</span>' : '';
          return `
            <div class="card" onclick="openDetail('${item.id}')">
              ${newBadge}
              ${imgHtml}
              <div class="card-info">
                <div class="card-id">${item.id}</div>
                <div class="card-channel">${item.channel || '/'}</div>
                <span class="card-status status-${item.status}">${item.status}</span>
                <button class="card-add-btn ${isAdded ? 'added' : ''}" onclick="event.stopPropagation();quickToggleList('${item.id}', this)">${isAdded ? '\u2713' : '+'}</button>
              </div>
            </div>
          `;
        }).join('');
      }
      renderPagination(totalPages);
    }

    function quickToggleList(id, btn) {
      let list = getList();
      const idx = list.findIndex(x => x.id === id);
      if (idx >= 0) {
        list.splice(idx, 1);
        btn.textContent = '+';
        btn.classList.remove('added');
      } else {
        const item = RAW_DATA.find(x => x.id === id);
        if (item) {
          list.push({ ...item, addedAt: new Date().toISOString() });
          btn.textContent = '\u2713';
          btn.classList.add('added');
        }
      }
      saveList(list);
    }

    // ============ 分页（支持跳转） ============
    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += `<span style="color:#aaa;padding:0 4px;">...</span>`;
        }
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>`;
      html += `
        <div class="page-jump-wrap">
          <input type="number" id="pageJumpInput" min="1" max="${totalPages}" value="${currentPage}" onkeypress="if(event.key==='Enter')jumpPage()">
          <span>/ ${totalPages}</span>
          <button class="page-btn" onclick="jumpPage()" style="padding:6px 10px;font-size:12px;">跳转</button>
        </div>`;
      el.innerHTML = html;
    }
    function goPage(p) {
      const items = getDisplayItems();
      const totalPages = Math.ceil(items.length / PAGE_SIZE) || 1;
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderCards();
      document.getElementById('homePage').scrollIntoView({ behavior: 'smooth' });
    }
    function jumpPage() {
      const input = document.getElementById('pageJumpInput');
      if (!input) return;
      const p = parseInt(input.value);
      goPage(p);
    }

    // ============ 详情弹窗 ============
    function buildDetailImage(item) {
      if (item.image && item.image !== '/') {
        const gradient = getGradient(item.id);
        const short = getShort(item.id);
        return `
          <img class="detail-img" src="${item.image}" alt="${item.id}"
            onclick="openImageViewer('${item.image}')" style="cursor:zoom-in;"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="detail-img-placeholder" style="background:${gradient};display:none;cursor:zoom-in;" onclick="openImageViewer('${item.image}')">${short}</div>`;
      }
      const overlayText = item.imgText || '暂无图片^ ^';
      return `
        <div class="card-img-wrap" style="border-radius:12px;margin-bottom:16px;cursor:zoom-in;" onclick="openImageViewer('${NO_IMG_FULL}')">
          <img src="${NO_IMG_FULL}" alt="暂无图片" style="border-radius:12px;">
          <div class="card-img-overlay" style="border-radius:12px;background:rgba(0,0,0,0.25);">${overlayText}</div>
        </div>`;
    }
    function openDetail(id) {
      let item = RAW_DATA.find(x => x.id === id);
      const isAdded = inList(id);
      // stale 项从本地快照取
      if (!item) {
        const list = getList();
        item = list.find(x => x.id === id);
        if (!item) return;
      }
      const isStale = !RAW_DATA.some(x => x.id === id);
      const ddlDate = parseDate(item.storageDDL);
      const today = new Date(); today.setHours(0,0,0,0);
      let ddlClass = '', ddlText = item.storageDDL;
      if (ddlDate) {
        const diff = Math.ceil((ddlDate - today) / (1000*60*60*24));
        if (diff < 0) { ddlClass = 'overdue'; ddlText += ` (已超时${Math.abs(diff)}天)`; }
        else if (diff <= 30) { ddlClass = 'warning'; ddlText += ` (剩${diff}天)`; }
        else { ddlClass = 'safe'; ddlText += ` (剩${diff}天)`; }
      }
      document.getElementById('detailModalContent').innerHTML = `
        <div class="modal-header">
          <div class="modal-title">商品详情${isStale ? ' <span style="color:#C62828;font-size:13px;">⚠️ 已过时</span>' : ''}</div>
          <button class="modal-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="modal-body">
          ${isStale ? '<div style="background:#FFF3E0;color:#E65100;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:600;">⚠️ 该商品已从最新数据中移除，以下为历史快照</div>' : ''}
          ${buildDetailImage(item)}
          <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value">${item.id}</span></div>
          <div class="detail-row"><span class="detail-label">渠道</span><span class="detail-value">${normalize(item.channel)}</span></div>
          <div class="detail-row"><span class="detail-label">谷子状态</span><span class="detail-value">${item.status}</span></div>
          <div class="detail-row"><span class="detail-label">来源</span><span class="detail-value">${item.sheet}</span></div>
          <div class="detail-row"><span class="detail-label">到货日</span><span class="detail-value">${normalize(item.arrivalDate)}</span></div>
          <div class="detail-row"><span class="detail-label">免费囤货ddl</span><span class="detail-value ${ddlClass}">${normalize(ddlText)}</span></div>
          <div class="detail-row"><span class="detail-label">备注</span><span class="detail-value">${normalize(item.note)}</span></div>
        </div>
        <div class="modal-actions">
          <button class="btn-primary ${isAdded ? 'added' : ''}" onclick="toggleList('${item.id}', this)">
            ${isAdded ? '已添加' : '添加List'}
          </button>
        </div>
      `;
      document.getElementById('detailModal').style.display = 'flex';
    }
    function closeDetail() {
      document.getElementById('detailModal').style.display = 'none';
    }
    // ============ 图片查看器 ============
    function openImageViewer(src) {
      if (!src || src === '/') return;
      const viewer = document.getElementById('imageViewer');
      document.getElementById('viewerImg').src = src;
      const link = document.getElementById('viewerDownload');
      link.href = src;
      const name = src.split('/').pop() || 'image';
      link.download = name;
      viewer.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeImageViewer() {
      document.getElementById('imageViewer').classList.remove('active');
      document.getElementById('viewerImg').src = '';
      document.body.style.overflow = '';
    }
    document.getElementById('detailModal').addEventListener('click', e => {
      if (e.target.id === 'detailModal') closeDetail();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const viewer = document.getElementById('imageViewer');
        if (viewer.classList.contains('active')) {
          closeImageViewer();
        } else {
          closeDetail();
        }
      }
    });

    // ============ List操作 ============
    function toggleList(id, btn) {
      let list = getList();
      const idx = list.findIndex(x => x.id === id);
      if (idx >= 0) {
        list.splice(idx, 1);
        btn.textContent = '添加List';
        btn.classList.remove('added');
      } else {
        const item = RAW_DATA.find(x => x.id === id);
        if (item) {
          list.push({ ...item, addedAt: new Date().toISOString() });
          btn.textContent = '已添加';
          btn.classList.add('added');
        }
      }
      saveList(list);
    }

    // ============ 我的页面 ============
    function renderMyPage() {
      const rawList = syncListItems();
      const today = new Date(); today.setHours(0,0,0,0);
      const staleCount = rawList.filter(x => x._stale).length;

      // 统计（基于最新数据，stale项也算）
      let guoxian = 0, overdue = 0, soon = 0;
      rawList.forEach(item => {
        if (item.status === '国现可排发' || item.status === '现货可排发') guoxian++;
        const ddl = parseDate(item.storageDDL);
        if (ddl) {
          const diff = Math.ceil((ddl - today) / (1000*60*60*24));
          if (diff < 0) overdue++;
          else if (diff <= 30) soon++;
        }
      });

      // 应用过滤
      let filteredList = rawList;
      let listTitle = '我的List';
      if (myListFilter === 'guoxian') {
        filteredList = rawList.filter(x => x.status === '国现可排发' || x.status === '现货可排发');
        listTitle = '国现可排发';
      } else if (myListFilter === 'overdue') {
        filteredList = rawList.filter(x => {
          const ddl = parseDate(x.storageDDL);
          if (!ddl) return false;
          return Math.ceil((ddl - today) / (1000*60*60*24)) < 0;
        });
        listTitle = '囤货已超时';
      } else if (myListFilter === 'soon') {
        filteredList = rawList.filter(x => {
          const ddl = parseDate(x.storageDDL);
          if (!ddl) return false;
          const diff = Math.ceil((ddl - today) / (1000*60*60*24));
          return diff >= 0 && diff <= 30;
        });
        listTitle = '一个月内过期';
      }

      // 头像 + 名字（未设置时显示提示）
      const staleTip = staleCount > 0 ? `（${staleCount}条已过时）` : '';
      if (cn) {
        document.getElementById('myAvatar').textContent = getShort(cn);
        document.getElementById('myAvatar').style.background = getGradient(cn);
        document.getElementById('myCnName').textContent = cn;
        document.getElementById('myCnName').style.color = '';
        document.getElementById('myCnDesc').textContent = `已添加 ${rawList.length} 件商品到List${staleTip}`;
      } else {
        document.getElementById('myAvatar').textContent = '?';
        document.getElementById('myAvatar').style.background = '#ccc';
        document.getElementById('myCnName').textContent = '请设置昵称';
        document.getElementById('myCnName').style.color = '#aaa';
        document.getElementById('myCnDesc').textContent = '点击上方区域设置你的CN';
      }
      document.getElementById('listCount').textContent = rawList.length;

      // 预警卡片（带点击）
      document.getElementById('alertStats').innerHTML = `
        <div class="alert-card green" onclick="filterMyList('guoxian')">
          <div class="alert-card-num">${guoxian}</div>
          <div class="alert-card-label">国现可排发</div>
        </div>
        <div class="alert-card red" onclick="filterMyList('overdue')">
          <div class="alert-card-num">${overdue}</div>
          <div class="alert-card-label">囤货已超时</div>
        </div>
        <div class="alert-card orange" onclick="filterMyList('soon')">
          <div class="alert-card-num">${soon}</div>
          <div class="alert-card-label">一个月内过期</div>
        </div>
      `;

      // List标题与返回按钮
      document.getElementById('myListTitle').firstChild.textContent = listTitle;
      document.getElementById('alertBackBtn').style.display = myListFilter ? 'inline' : 'none';

      // List卡片
      const container = document.getElementById('myListContainer');
      if (filteredList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128230;</div>
            <div class="empty-state-text">${myListFilter ? '没有满足该条件的商品' : '还没有添加任何商品，去首页看看吧~'}</div>
          </div>
        `;
      } else {
        container.innerHTML = `<div class="card-grid">` + filteredList.map(item => {
          const imgHtml = buildCardImage(item);
          const staleClass = item._stale ? ' stale' : '';
          const statusText = item._stale ? item.status : item.status;
          return `
            <div class="card${staleClass}" onclick="openDetail('${item.id}')">
              ${imgHtml}
              <div class="card-info">
                <div class="card-id">${item.id}</div>
                <div class="card-channel">${item.channel || '/'}</div>
                <span class="card-status status-${statusText}">${statusText}</span>
              </div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }

    function filterMyList(type) {
      myListFilter = type;
      renderMyPage();
      document.getElementById('myPage').scrollIntoView({ behavior: 'smooth' });
    }
    function showAllList() {
      myListFilter = null;
      renderMyPage();
    }

    // ============ 启动 ============
    // init() 由 fetch('data.json') 成功后自动调用
  </script>
</body>
</html>
